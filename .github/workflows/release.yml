#
# 打 v* tag 时构建静态 helper 并挂到 Release。
# 静态二进制是为了一个文件通吃各发行版，用户不必安装 MoonBit。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: 安装依赖
        run: |
          # base-devel 必需：它带来 make、gcc 和 binutils（ar）。
          # archlinux 镜像只含 base，缺了它连 moon build 的原生后端都跑不起来。
          pacman -Syu --noconfirm --needed base-devel bash python nodejs qt6-declarative git github-cli

      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL -o /tmp/moon-install.sh https://cli.moonbitlang.com/install/unix.sh
          MOONBIT_INSTALL_VERSION=nightly bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 更新 Mooncakes registry 索引
        # 全新环境里 moon 的 registry 索引是空的，不刷新就解析不到依赖，
        # 报 "module was not found in the registry"。这一步不能省。
        run: moon update

      - name: 检查与测试
        run: make ci

      - name: 静态构建
        run: bash scripts/build-static.sh

      - name: 准备发布资产
        run: |
          # 打成一个包：用户下载一次就够，不必在发布页上挑文件
          ver="${GITHUB_REF_NAME#v}"
          stage="dist/winwitch-$ver"
          mkdir -p "$stage"
          cp _build/native/release/build/cmd/main/main.exe "$stage/winwitch-helper"
          cp -r kwin panel overlay data scripts "$stage/"
          cp scripts/install-release.sh "$stage/install.sh"
          chmod +x "$stage/install.sh"
          tar -C dist -czf "dist/winwitch-$ver.tar.gz" "winwitch-$ver"
          rm -rf "$stage"
          ls -lh dist/

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 容器以 root 运行，检出目录属主不同；git 会拒绝操作，
          # 而 gh release create 内部要调 git。这行不能省。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # 发布说明保持简短、英文优先：长文案没人看，还容易过期
          notes="Letters for windows. Press Meta+F, then one letter. Install: unpack, run ./install.sh. See README for the two manual steps (panel widget, shortcut)."
          # 带连字符的 tag 是语义版本里的预发布（如 v0.1.2-rc-1）：
          # 标成 prerelease，GitHub 就不会把它推给普通用户
          extra=""
          case "$GITHUB_REF_NAME" in
            *-*) extra="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "WinWitch $GITHUB_REF_NAME" --notes "$notes" $extra \
          || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
