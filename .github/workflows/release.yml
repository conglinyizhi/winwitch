#
# 打 v* tag 时构建静态 helper 并挂到 Release。
# 静态二进制是为了一个文件通吃各发行版，用户不必安装 MoonBit。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: 安装依赖
        run: |
          # base-devel 必需：它带来 make、gcc 和 binutils（ar）。
          # archlinux 镜像只含 base，缺了它连 moon build 的原生后端都跑不起来。
          pacman -Syu --noconfirm --needed base-devel bash python nodejs qt6-declarative git github-cli

      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL -o /tmp/moon-install.sh https://cli.moonbitlang.com/install/unix.sh
          MOONBIT_INSTALL_VERSION=nightly bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 更新 Mooncakes registry 索引
        # 全新环境里 moon 的 registry 索引是空的，不刷新就解析不到依赖，
        # 报 "module was not found in the registry"。这一步不能省。
        run: moon update

      - name: 检查与测试
        run: make ci

      - name: 静态构建
        run: bash scripts/build-static.sh

      - name: 准备发布资产
        run: |
          mkdir -p dist
          cp _build/native/release/build/cmd/main/main.exe dist/winwitch-helper
          # 不放 scripts/install.sh：它假定有仓库布局和 MoonBit 工具链，
          # 对拿预编译产物的用户是个陷阱（会在 moon build 那步失败）。
          # 面向发布的手动安装步骤写在 README 的「From a release」一节。
          tar -czf "dist/winwitch-${GITHUB_REF_NAME#v}-addon.tar.gz" \
            kwin panel overlay data scripts/reload.sh

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
